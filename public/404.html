<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BioBuzz Scout — Page Not Found</title>
  <script>
    // GitHub Pages SPA redirect: store the path and redirect to index
    // The app will detect the redirect and show the About/404 page
    sessionStorage.setItem('gh-pages-redirect', window.location.pathname);
    window.location.replace(
      window.location.origin + '/ftc-biobuzz/?404=' + encodeURIComponent(window.location.pathname)
    );
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f8f8; color: #1a1a1a; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { text-align: center; padding: 40px; max-width: 500px; }
    h1 { color: #cc0000; font-size: 64px; margin: 0; font-weight: 900; }
    p { color: #555; font-size: 16px; line-height: 1.6; }
    a { color: #cc0000; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <noscript>
    <div class="box">
      <h1>404</h1>
      <p>Page not found.</p>
      <p><a href="/ftc-biobuzz/">Go to BioBuzz Scout</a></p>
    </div>
  </noscript>
</body>
</html>
